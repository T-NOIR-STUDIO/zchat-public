<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — ZChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="any" />
    <link rel="icon" href="/assets/img/favicon-16.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .pf-hero {
            position: relative;
            border-radius: 24px;
            overflow: visible;
            background: linear-gradient(165deg, var(--elevated2) 0%, var(--elevated) 50%, var(--surface, #0a0a0a) 100%);
            border: 1px solid var(--hairline);
            padding: 2rem 1.25rem 1.5rem;
        }
        .pf-hero-glow {
            position: absolute; left: 0; right: 0; top: 0; height: 120px;
            background: radial-gradient(ellipse 70% 80% at 50% 0%, rgba(28,155,239,.25), transparent 70%);
            pointer-events: none; border-radius: 24px 24px 0 0;
        }
        .pf-ring {
            width: 108px; height: 108px; border-radius: 50%;
            padding: 3px;
            background: linear-gradient(145deg, #1c9bef, #7c3aed 55%, #1c9bef);
            position: relative;
        }
        #avatarPreview {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: var(--elevated2); color: var(--ink);
            font-size: 2rem; font-weight: 600;
            border: 3px solid var(--canvas);
        }
        #avatarPreview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .pf-cam {
            position: absolute; right: -2px; bottom: -2px;
            width: 34px; height: 34px; border-radius: 50%;
            background: #1c9bef; color: #fff; border: 3px solid var(--canvas);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
            transition: transform .12s ease;
        }
        .pf-cam:hover { transform: scale(1.08); }
        .pf-card {
            border-radius: 18px;
            border: 1px solid var(--hairline);
            background: var(--surface, var(--elevated));
            padding: 1.1rem 1.15rem;
        }
        .pf-label {
            font-size: 11px; font-weight: 700; letter-spacing: .07em;
            text-transform: uppercase; color: var(--faint); margin-bottom: 8px; display: block;
        }
        .pf-input {
            width: 100%; padding: 12px 14px; font-size: 14px; font-weight: 500;
            border-radius: 12px; border: 1px solid var(--hairline);
            background: var(--elevated); color: var(--ink);
            transition: border-color .15s, box-shadow .15s;
        }
        .pf-input:focus {
            outline: none;
            border-color: rgba(28,155,239,.7);
            box-shadow: 0 0 0 3px rgba(28,155,239,.14);
        }
        .pf-input::placeholder { color: var(--faint); }
        .pf-pres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .seg-btn {
            border-radius: 12px; padding: 11px 6px; font-size: 12px; font-weight: 600;
            border: 1px solid var(--hairline); background: var(--elevated); color: var(--muted);
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: .15s;
        }
        .seg-btn[aria-pressed="true"] {
            background: rgba(28,155,239,.14);
            border-color: rgba(28,155,239,.5);
            color: var(--ink);
        }
        .pf-theme {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 12px; border-radius: 14px;
            background: var(--elevated); border: 1px solid var(--hairline);
        }
        .switch-track { background: var(--elevated2); border: 1px solid var(--hairline); }
        .switch-track[data-on="true"] { background: #1c9bef; border-color: transparent; }
        .switch-thumb { background: #fff; transition: transform .15s ease; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
        .switch-track[data-on="true"] .switch-thumb { transform: translateX(1.25rem); }
        .pf-save {
            width: 100%; border: none; border-radius: 999px; padding: 14px;
            font-size: 14px; font-weight: 700; color: #fff; background: #1c9bef;
            box-shadow: 0 10px 28px rgba(28,155,239,.3);
            transition: opacity .15s, transform .1s;
        }
        .pf-save:hover { opacity: .92; }
        .pf-save:active { transform: scale(.98); }
        @media (min-width: 640px) {
            #bottomNav { border-top: none !important; border-right: 1px solid var(--hairline); }
        }
    </style>
</head>
<body class="h-full font-body overflow-hidden">
<div class="flex flex-col sm:flex-row h-screen w-full overflow-hidden pb-[60px] sm:pb-0" style="background-color: var(--canvas);">

    <!-- Navbar = index.html bottomNav -->
    <nav id="bottomNav"
         class="fixed sm:static bottom-0 left-0 z-50 flex sm:h-full w-full sm:w-[72px] h-[60px] shrink-0 flex-row sm:flex-col items-center justify-around sm:justify-between sm:py-5 px-4 sm:px-0"
         style="border-top: 1px solid var(--hairline); background-color: var(--canvas);"
         aria-label="Primary">
        <div class="contents sm:flex sm:flex-col sm:items-center sm:w-full">
            <div class="hidden sm:flex mb-6 h-9 w-9 items-center justify-center" style="color: var(--ink);">
                <a href="index.html" aria-label="Home">
                    <svg width="26" height="26" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                        <path d="M50 8C26.8 8 8 25.4 8 47c0 11.2 5 21.3 13.1 28.4L17 92l19.1-7.7A45.6 45.6 0 0 0 50 86c23.2 0 42-17.4 42-39S73.2 8 50 8Z"
                              fill="currentColor" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
            <ul class="flex flex-row sm:flex-col flex-1 sm:flex-initial items-center justify-around sm:justify-start w-full sm:w-auto gap-2">
                <li>
                    <a href="index.html" aria-label="Chats" class="nav-btn flex h-11 w-11 items-center justify-center rounded-2xl transition-colors" style="color: var(--muted);">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                    </a>
                </li>
                <li>
                    <a href="settings.html" aria-label="Settings" class="flex h-11 w-11 items-center justify-center rounded-2xl transition-colors hover:bg-elevated" style="color: var(--muted);">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </a>
                </li>
                <li>
                    <a href="report.html" aria-label="Report a bug" class="flex h-11 w-11 items-center justify-center rounded-2xl transition-colors hover:bg-elevated" style="color: var(--muted);">
                        <i data-lucide="bug" class="w-5 h-5"></i>
                    </a>
                </li>
            </ul>
        </div>
        <a href="profile.html" id="profileBtn" aria-label="Profile" class="hidden sm:flex rounded-full items-center justify-center shrink-0" style="box-shadow: 0 0 0 2px #1c9bef;">
            <div id="profileAvatar" class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold select-none"></div>
        </a>
    </nav>

    <div class="flex-1 overflow-y-auto scrollbar-thin min-w-0">
        <main class="mx-auto w-full max-w-md px-4 py-6 sm:px-6 sm:py-9">
            <header class="mb-5">
                <h1 class="font-display text-2xl font-extrabold tracking-tight" style="color: var(--ink);">Profile</h1>
                <p class="mt-1 text-sm" style="color: var(--muted);">How you appear to others on ZChat</p>
            </header>

            <form id="profileForm" class="flex flex-col gap-3.5" autocomplete="off">

                <!-- Avatar hero -->
                <section class="pf-hero flex flex-col items-center">
                    <div class="pf-hero-glow"></div>
                    <div class="relative z-[1]">
                        <div class="pf-ring">
                            <div id="avatarPreview" class="select-none"></div>
                        </div>
                        <span id="presenceDotPreview" class="absolute z-[2] h-[18px] w-[18px] rounded-full"
                              style="right: 4px; bottom: 4px; border: 2.5px solid var(--canvas); background-color: var(--online);"></span>
                        <button type="button" id="changeAvatarBtn" class="pf-cam z-[3]" aria-label="Change avatar">
                            <i data-lucide="camera" class="w-3.5 h-3.5"></i>
                        </button>
                        <div id="avatarPopover" class="hidden absolute left-1/2 top-[calc(100%+12px)] z-30 w-72 -translate-x-1/2 rounded-2xl p-3 shadow-2xl"
                             style="background-color: var(--elevated); border: 1px solid var(--hairline);">
                            <div class="mb-3 flex gap-1 rounded-pill p-1" style="background-color: var(--elevated2);">
                                <button type="button" data-avatar-tab="color" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold">Color</button>
                                <button type="button" data-avatar-tab="emoji" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold">Emoji</button>
                                <button type="button" data-avatar-tab="photo" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold">Photo</button>
                            </div>
                            <div id="colorSwatches" class="grid grid-cols-6 gap-2"></div>
                            <div id="emojiSwatches" class="hidden grid grid-cols-6 gap-1"></div>
                            <div id="photoPanel" class="hidden flex-col items-center gap-3 py-2">
                                <input type="file" id="avatarFileInput" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />
                                <button type="button" id="uploadPhotoBtn" class="flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-xs font-semibold" style="background-color: var(--elevated2); color: var(--ink);">
                                    <i data-lucide="upload" class="w-4 h-4"></i>
                                    <span id="uploadPhotoBtnLabel">Upload photo</span>
                                </button>
                                <p id="photoUploadError" class="hidden text-center text-xs" style="color: var(--dnd);"></p>
                                <p class="text-center text-[11px]" style="color: var(--faint);">PNG, JPG, WEBP · Max 5MB</p>
                            </div>
                        </div>
                    </div>
                    <p id="usernamePreview" class="relative z-[1] mt-3 text-sm font-semibold tracking-tight" style="color: var(--ink);"></p>
                </section>

                <!-- Name & status -->
                <section class="pf-card space-y-4">
                    <div>
                        <label for="usernameField" class="pf-label">Username</label>
                        <input id="usernameField" type="text" maxlength="24" class="pf-input" placeholder="yourname" />
                        <p id="usernameError" class="hidden mt-1.5 text-xs" style="color: var(--dnd);">Username can't be empty.</p>
                    </div>
                    <div>
                        <label for="bioField" class="pf-label">Status</label>
                        <input id="bioField" type="text" maxlength="60" class="pf-input" placeholder="Available, In a meeting…" />
                        <p id="statusDesc" class="mt-1.5 text-[11px]" style="color: var(--faint);">Shown next to your name in chats</p>
                    </div>
                </section>

                <!-- Presence -->
                <section class="pf-card">
                    <span id="presenceLabel" class="pf-label">Presence</span>
                    <div class="pf-pres">
                        <button type="button" data-presence="online" class="seg-btn presence-btn" aria-pressed="false">
                            <span class="h-2 w-2 rounded-full shrink-0" style="background-color: var(--online);"></span>
                            <span class="presence-text">Online</span>
                        </button>
                        <button type="button" data-presence="away" class="seg-btn presence-btn" aria-pressed="false">
                            <span class="h-2 w-2 rounded-full shrink-0" style="background-color: var(--away);"></span>
                            <span class="presence-text">Away</span>
                        </button>
                        <button type="button" data-presence="dnd" class="seg-btn presence-btn" aria-pressed="false">
                            <span class="h-2 w-2 rounded-full shrink-0" style="background-color: var(--dnd);"></span>
                            <span class="presence-text">DND</span>
                        </button>
                    </div>
                </section>

                <!-- Theme -->
                <section class="pf-card">
                    <span id="appearanceLabel" class="pf-label">Appearance</span>
                    <div class="pf-theme">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl" style="background: var(--elevated2); color: var(--ink);">
                                <i id="themeIcon" data-lucide="moon" class="w-[18px] h-[18px]"></i>
                            </div>
                            <div class="min-w-0">
                                <p id="themeTitle" class="text-sm font-semibold" style="color: var(--ink);">Theme</p>
                                <p id="themeLabel" class="text-xs" style="color: var(--faint);">Dark mode</p>
                            </div>
                        </div>
                        <button type="button" id="themeSwitch" role="switch" aria-checked="false"
                                class="switch-track relative h-7 w-12 shrink-0 rounded-pill transition-colors" data-on="false">
                            <span class="switch-thumb absolute top-1 left-1 h-5 w-5 rounded-full"></span>
                        </button>
                    </div>
                </section>

                <div class="pt-2 pb-10">
                    <button id="saveBtn" type="submit" class="pf-save">Save changes</button>
                </div>
            </form>
        </main>
    </div>
</div>

<div id="toast" class="fixed bottom-20 sm:bottom-6 right-4 sm:right-6 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50 border"
     style="background-color: var(--elevated); border-color: var(--hairline); color: var(--ink);">
    <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full" style="background-color: rgba(49,208,124,.15); color: var(--online);">
        <i data-lucide="check" class="w-4 h-4"></i>
    </div>
    <span id="toastMsg" class="text-xs font-semibold">Profile updated successfully!</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => { if (window.lucide) lucide.createIcons(); });</script>
</body>
</html>
