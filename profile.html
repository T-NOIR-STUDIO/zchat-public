<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — ZChat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="any" />
    <link rel="icon" href="/assets/img/favicon-16.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .pf-card {
            background-color: var(--elevated);
            border: 1px solid var(--hairline);
            border-radius: 20px;
        }
        .pf-input {
            background-color: var(--elevated2);
            color: var(--ink);
            border: 1px solid transparent;
            border-radius: 14px;
        }
        .pf-input:focus {
            outline: none;
            border-color: rgba(28, 155, 240, 0.55);
        }
        .pf-save { background-color: #1c9bef; color: #fff; }
        .pf-save:hover { opacity: 0.92; }
        .seg-btn[aria-pressed="true"] {
            background-color: var(--elevated2);
            color: var(--ink);
            box-shadow: 0 0 0 1px var(--hairline);
        }
        .seg-btn[aria-pressed="false"] { background: transparent; color: var(--muted); }
        .switch-track { background-color: var(--elevated2); }
        .switch-track[data-on="true"] { background-color: #1c9bef; }
        .switch-thumb {
            background: #fff;
            transition: transform .15s ease;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
        }
        .switch-track[data-on="true"] .switch-thumb { transform: translateX(1.25rem); }
        #avatarPreview {
            background-color: var(--elevated2);
            box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5px rgba(28,155,240,.35);
        }
        /* match index border-right on desktop nav */
        @media (min-width: 640px) {
            #bottomNav {
                border-top: none !important;
                border-right: 1px solid var(--hairline);
            }
        }
    </style>
</head>

<body class="h-full font-body overflow-hidden">
<div class="flex flex-col sm:flex-row h-screen w-full overflow-hidden pb-[60px] sm:pb-0" style="background-color: var(--canvas);">

    <!-- Navbar — copy y hệt index.html (bottomNav) -->
    <nav id="bottomNav"
         class="fixed sm:static bottom-0 left-0 z-50 flex sm:h-full w-full sm:w-[72px] h-[60px] shrink-0 flex-row sm:flex-col items-center justify-around sm:justify-between sm:py-5 px-4 sm:px-0"
         style="border-top: 1px solid var(--hairline); background-color: var(--canvas);"
         aria-label="Primary">
        <div class="contents sm:flex sm:flex-col sm:items-center sm:w-full">
            <div class="hidden sm:flex mb-6 h-9 w-9 items-center justify-center" style="color: var(--ink);">
                <a href="index.html" aria-label="Home">
                    <svg width="26" height="26" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                        <path d="M50 8C26.8 8 8 25.4 8 47c0 11.2 5 21.3 13.1 28.4L17 92l19.1-7.7A45.6 45.6 0 0 0 50 86c23.2 0 42-17.4 42-39S73.2 8 50 8Z"
                              fill="currentColor" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
            <ul class="flex flex-row sm:flex-col flex-1 sm:flex-initial items-center justify-around sm:justify-start w-full sm:w-auto gap-2">
                <li>
                    <a href="index.html" aria-label="Chats"
                       class="nav-btn flex h-11 w-11 items-center justify-center rounded-2xl transition-colors"
                       style="color: var(--muted);">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                    </a>
                </li>
                <li>
                    <a href="settings.html" aria-label="Settings"
                       class="flex h-11 w-11 items-center justify-center rounded-2xl transition-colors hover:bg-elevated"
                       style="color: var(--muted);">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </a>
                </li>
                <li>
                    <a href="report.html" aria-label="Report a bug"
                       class="flex h-11 w-11 items-center justify-center rounded-2xl transition-colors hover:bg-elevated"
                       style="color: var(--muted);">
                        <i data-lucide="bug" class="w-5 h-5"></i>
                    </a>
                </li>
            </ul>
        </div>
        <a href="profile.html" id="profileBtn" aria-label="Profile"
           class="hidden sm:flex rounded-full items-center justify-center shrink-0"
           style="box-shadow: 0 0 0 2px #1c9bef;">
            <div id="profileAvatar"
                 class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold select-none"></div>
        </a>
    </nav>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto scrollbar-thin min-w-0">
        <main class="mx-auto w-full max-w-lg px-4 py-6 sm:px-8 sm:py-10">
            <header class="mb-6 sm:mb-8">
                <p class="text-[11px] font-bold uppercase tracking-wider mb-1" style="color: var(--faint);">Account</p>
                <h1 class="font-display text-2xl sm:text-3xl font-extrabold tracking-tight" style="color: var(--ink);">Edit Profile</h1>
                <p class="mt-1 text-sm" style="color: var(--muted);">Avatar, name, status and appearance.</p>
            </header>

            <form id="profileForm" class="flex flex-col gap-5" autocomplete="off">
                <section class="pf-card p-6 flex flex-col items-center gap-4">
                    <div class="relative">
                        <div id="avatarPreview"
                             class="flex h-28 w-28 items-center justify-center rounded-full text-3xl font-semibold select-none overflow-hidden"
                             style="color: var(--ink);"></div>
                        <span id="presenceDotPreview"
                              class="absolute bottom-1 right-1 h-5 w-5 rounded-full"
                              style="border: 3px solid var(--elevated); background-color: var(--online);"></span>
                    </div>
                    <div class="relative">
                        <button type="button" id="changeAvatarBtn"
                                class="flex items-center gap-2 rounded-pill px-4 py-2 text-sm font-semibold transition-colors"
                                style="background-color: var(--elevated2); color: var(--ink);">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                            Change avatar
                        </button>
                        <div id="avatarPopover"
                             class="hidden absolute left-1/2 top-full z-20 mt-2 w-72 -translate-x-1/2 rounded-2xl p-3 shadow-2xl"
                             style="background-color: var(--elevated); border: 1px solid var(--hairline);">
                            <div class="mb-3 flex gap-1 rounded-pill p-1" style="background-color: var(--elevated2);">
                                <button type="button" data-avatar-tab="color" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold transition-colors">Color</button>
                                <button type="button" data-avatar-tab="emoji" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold transition-colors">Emoji</button>
                                <button type="button" data-avatar-tab="photo" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold transition-colors">Photo</button>
                            </div>
                            <div id="colorSwatches" class="grid grid-cols-6 gap-2"></div>
                            <div id="emojiSwatches" class="hidden grid grid-cols-6 gap-1"></div>
                            <div id="photoPanel" class="hidden flex-col items-center gap-3 py-2">
                                <input type="file" id="avatarFileInput" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />
                                <button type="button" id="uploadPhotoBtn"
                                        class="flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-xs font-semibold"
                                        style="background-color: var(--elevated2); color: var(--ink);">
                                    <i data-lucide="upload" class="w-4 h-4"></i>
                                    <span id="uploadPhotoBtnLabel">Upload photo</span>
                                </button>
                                <p id="photoUploadError" class="hidden text-center text-xs" style="color: var(--dnd);"></p>
                                <p class="text-center text-[11px]" style="color: var(--faint);">PNG, JPG, WEBP or GIF · Max 5MB</p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="pf-card p-5 flex flex-col gap-5">
                    <div class="flex flex-col gap-2">
                        <label for="usernameField" class="text-xs font-bold uppercase tracking-wider" style="color: var(--faint);">Username</label>
                        <input id="usernameField" type="text" maxlength="24" class="pf-input w-full px-4 py-3 text-sm font-medium" />
                        <p id="usernamePreview" class="text-xs" style="color: var(--faint);"></p>
                        <p id="usernameError" class="hidden text-xs" style="color: var(--dnd);">Username can't be empty.</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="bioField" class="text-xs font-bold uppercase tracking-wider" style="color: var(--faint);">Status</label>
                        <input id="bioField" type="text" maxlength="60" placeholder="e.g. Available, In a meeting..."
                               class="pf-input w-full px-4 py-3 text-sm" />
                        <p id="statusDesc" class="text-xs" style="color: var(--faint);">Shown next to your name in chats.</p>
                    </div>
                </section>

                <section class="pf-card p-5 flex flex-col gap-3">
                    <span id="presenceLabel" class="text-xs font-bold uppercase tracking-wider" style="color: var(--faint);">Presence</span>
                    <div class="grid grid-cols-3 gap-1.5 rounded-2xl p-1" style="background-color: var(--elevated2);">
                        <button type="button" data-presence="online" class="seg-btn presence-btn flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-xs font-semibold" aria-pressed="false">
                            <span class="h-2 w-2 rounded-full shrink-0" style="background-color: var(--online);"></span>
                            <span class="presence-text">Online</span>
                        </button>
                        <button type="button" data-presence="away" class="seg-btn presence-btn flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-xs font-semibold" aria-pressed="false">
                            <span class="h-2 w-2 rounded-full shrink-0" style="background-color: var(--away);"></span>
                            <span class="presence-text">Away</span>
                        </button>
                        <button type="button" data-presence="dnd" class="seg-btn presence-btn flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-xs font-semibold" aria-pressed="false">
                            <span class="h-2 w-2 rounded-full shrink-0" style="background-color: var(--dnd);"></span>
                            <span class="presence-text">DND</span>
                        </button>
                    </div>
                </section>

                <section class="pf-card p-5">
                    <span id="appearanceLabel" class="text-xs font-bold uppercase tracking-wider block mb-3" style="color: var(--faint);">Appearance</span>
                    <div class="flex items-center justify-between rounded-2xl px-3 py-3" style="background-color: var(--elevated2);">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl" style="background-color: var(--elevated); color: var(--ink);">
                                <i id="themeIcon" data-lucide="moon" class="w-[18px] h-[18px]"></i>
                            </div>
                            <div class="min-w-0">
                                <p id="themeTitle" class="text-sm font-medium truncate">Theme</p>
                                <p id="themeLabel" class="text-xs" style="color: var(--faint);">Dark mode</p>
                            </div>
                        </div>
                        <button type="button" id="themeSwitch" role="switch" aria-checked="false"
                                class="switch-track relative h-7 w-12 shrink-0 rounded-pill transition-colors" data-on="false">
                            <span class="switch-thumb absolute top-1 left-1 h-5 w-5 rounded-full"></span>
                        </button>
                    </div>
                </section>

                <div class="pt-1 pb-8">
                    <button id="saveBtn" type="submit"
                            class="pf-save w-full rounded-pill px-8 py-3.5 text-sm font-bold tracking-wide transition-all shadow-md">
                        Save Changes
                    </button>
                </div>
            </form>
        </main>
    </div>
</div>

<div id="toast"
     class="fixed bottom-20 sm:bottom-6 right-4 sm:right-6 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50 border"
     style="background-color: var(--elevated); border-color: var(--hairline); color: var(--ink);">
    <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full" style="background-color: rgba(49,208,124,.15); color: var(--online);">
        <i data-lucide="check" class="w-4 h-4"></i>
    </div>
    <span id="toastMsg" class="text-xs font-semibold">Profile updated successfully!</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) lucide.createIcons();
    });
</script>
</body>
</html>
