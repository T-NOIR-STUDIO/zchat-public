<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="dark">
<script>
/* Sync theme with Settings (localStorage zchat_theme) before paint */
(function () {
  try {
    var th = localStorage.getItem("zchat_theme") || "dark";
    if (th !== "light" && th !== "dark") th = "dark";
    document.documentElement.setAttribute("data-theme", th);
    document.documentElement.style.backgroundColor = th === "light" ? "#FFFFFF" : "#000000";
  } catch (e) {}
})();
</script>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile / ZChat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="any" />
    <link rel="icon" href="/assets/img/favicon-16.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/base-theme.css">
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        #themeSwitch.switch-track[data-on="true"],
        #themeSwitch[data-on="true"] {
            background-color: #1c9bf0 !important;
        }
        #themeSwitch[data-on="true"] .switch-thumb {
            background-color: #fff !important;
        }

        #presenceDotPreview { display: none !important; }
        #usernameField,
        #usernameField:focus,
        #usernameField:focus-visible {
            border-radius: 1rem !important;
            outline: none !important;
            box-shadow: none !important;
        }
        #avatarPopover { min-width: 22rem; }
        #avatarPopover .color-swatch { width: 2.5rem !important; height: 2.5rem !important; }
        #avatarPopover .emoji-swatch { font-size: 1.35rem !important; padding: 0.45rem !important; }
        #avatarPopover .avatar-tab { font-size: 0.8rem !important; padding-top: 0.45rem !important; padding-bottom: 0.45rem !important; }
    </style>
</head>

<body class="h-full font-body overflow-hidden" style="background-color: var(--canvas); color: var(--ink);">

<div class="flex flex-col sm:flex-row h-screen w-full overflow-hidden pb-[60px] sm:pb-0" style="background-color: var(--canvas);">
    <nav id="bottomNav"
         class="fixed sm:static bottom-0 left-0 z-50 flex sm:h-full w-full sm:w-[72px] h-[60px] shrink-0 flex-row sm:flex-col items-center justify-around sm:justify-between sm:py-5 px-4 sm:px-0"
         style="border-top: 1px solid var(--hairline); sm:border-top: none; sm:border-right: 1px solid var(--hairline); background-color: var(--canvas);" aria-label="Primary">
        <div class="contents sm:flex sm:flex-col sm:items-center sm:w-full">
            <div class="hidden sm:flex mb-6 h-9 w-9 items-center justify-center">
                <a href="index.html" aria-label="Home">
                    <svg width="26" height="26" viewBox="0 0 100 100" fill="none" aria-hidden="true">
                        <path d="M50 8C26.8 8 8 25.4 8 47c0 11.2 5 21.3 13.1 28.4L17 92l19.1-7.7A45.6 45.6 0 0 0 50 86c23.2 0 42-17.4 42-39S73.2 8 50 8Z"
                              fill="currentColor" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
            <ul class="flex flex-row sm:flex-col flex-1 sm:flex-initial items-center justify-around sm:justify-start w-full sm:w-auto gap-2">
                <li>
                    <a href="index.html" aria-label="Chats"
                       class="nav-btn flex h-11 w-11 items-center justify-center rounded-2xl transition-colors"
                       style="color: var(--muted);">
                        <i data-lucide="message-circle" class="w-5 h-5"></i>
                    </a>
                </li>
                <li>
                    <a href="settings.html" aria-label="Settings"
                       class="flex h-11 w-11 items-center justify-center rounded-2xl transition-colors hover:bg-elevated"
                       style="color: var(--muted);">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </a>
                </li>
                <li>
                    <a href="report.html" aria-label="Report a bug"
                       class="flex h-11 w-11 items-center justify-center rounded-2xl transition-colors hover:bg-elevated"
                       style="color: var(--muted);">
                        <i data-lucide="bug" class="w-5 h-5"></i>
                    </a>
                </li>
            </ul>
        </div>
        <a href="profile.html" id="profileBtn" aria-label="Profile"
           class="flex rounded-full items-center justify-center shrink-0">
            <div id="profileAvatar"
                 class="flex h-9 w-9 items-center justify-center rounded-full text-sm font-semibold select-none"
                 style="background-color: var(--elevated); color: var(--ink);"></div>
        </a>
    </nav>

    <div class="flex-1 min-w-0 overflow-y-auto scrollbar-thin">
        <div class="mx-auto flex w-full max-w-2xl flex-col">

            <!-- Header -->
            <header class="flex items-center gap-3 px-5 py-4 sm:px-6" style="border-bottom: 1px solid var(--hairline);">
                <a href="index.html" id="backToChatBtn" aria-label="Back"
                   class="flex h-10 w-10 items-center justify-center rounded-full transition-colors"
                   style="background-color: var(--elevated); color: var(--ink);"
                   onmouseover="this.style.backgroundColor='var(--elevated2)'"
                   onmouseout="this.style.backgroundColor='var(--elevated)'">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <h1 class="font-display text-lg font-extrabold tracking-tight ml-1">Edit Profile</h1>
            </header>

            <!-- Content -->
            <div class="px-5 py-8 sm:px-6">
                <form id="profileForm" class="mx-auto flex w-full max-w-md flex-col gap-16" autocomplete="off">

                    <!-- Avatar -->
                    <section class="flex flex-col items-center gap-4">
                        <div class="relative">
                            <div id="avatarPreview"
                                 class="flex h-24 w-24 items-center justify-center rounded-full text-3xl font-semibold select-none overflow-hidden"
                                 style="background-color: var(--elevated); color: var(--ink); border: 2px solid var(--hairline);"></div>
                        </div>

                        <div class="relative">
                            <button type="button" id="changeAvatarBtn"
                                    class="flex items-center gap-2 rounded-pill px-4 py-2 text-sm font-semibold transition-colors"
                                    style="background-color: var(--elevated); color: var(--ink);">
                                <i data-lucide="image" class="w-4 h-4"></i>
                                Change avatar
                            </button>

                            <!-- Avatar picker popover -->
                            <div id="avatarPopover" class="hidden absolute left-1/2 top-full z-20 mt-2 w-96 -translate-x-1/2 rounded-2xl p-4 shadow-2xl"
                                 style="background-color: var(--elevated); border: 1px solid var(--hairline);">
                                <div class="mb-3 flex gap-1 rounded-pill p-1" style="background-color: var(--elevated2);">
                                    <button type="button" data-avatar-tab="color" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold transition-colors">Color</button>
                                    <button type="button" data-avatar-tab="emoji" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold transition-colors">Emoji</button>
                                    <button type="button" data-avatar-tab="photo" class="avatar-tab flex-1 rounded-pill py-1.5 text-xs font-semibold transition-colors">Photo</button>
                                </div>
                                <div id="colorSwatches" class="grid grid-cols-6 gap-2"></div>
                                <div id="emojiSwatches" class="hidden grid grid-cols-6 gap-1"></div>
                                <div id="photoPanel" class="hidden flex-col items-center gap-3 py-2">
                                    <input type="file" id="avatarFileInput" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden" />
                                    <button type="button" id="uploadPhotoBtn"
                                            class="flex w-full items-center justify-center gap-2 rounded-xl py-2.5 text-xs font-semibold transition-colors"
                                            style="background-color: var(--elevated2); color: var(--ink);">
                                        <i data-lucide="upload" class="w-4 h-4"></i>
                                        <span id="uploadPhotoBtnLabel">Upload photo</span>
                                    </button>
                                    <p id="photoUploadError" class="hidden text-center text-xs" style="color: var(--dnd);"></p>
                                    <p class="text-center text-[11px]" style="color: var(--faint);">PNG, JPG, WEBP or GIF · Max 5MB</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Username -->
                    <section class="flex flex-col gap-2">
                        <label for="usernameField" class="text-sm font-semibold">Username</label>
                        <input id="usernameField" type="text" maxlength="24"
                               class="w-full rounded-2xl px-4 py-3 text-sm focus:outline-none"
                               style="background-color: var(--elevated); color: var(--ink); border-radius: 1rem;" />
                        <p id="usernamePreview" class="text-xs" style="color: var(--faint);"></p>
                        <p id="usernameError" class="hidden text-xs" style="color: var(--dnd);">Username can't be empty.</p>
                    </section>

                    <!-- Save Action Button -->
                    <div class="flex items-center justify-end pt-2 pb-8">
                        <button id="saveBtn" type="submit" class="rounded-pill px-8 py-3 text-xs font-bold tracking-wide transition-all shadow-md hover:opacity-90 active:scale-95" style="background-color: var(--ink); color: var(--canvas);">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Custom Toast Notification -->
<div id="toast" class="fixed bottom-20 sm:bottom-6 right-6 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-50 border" style="background-color: var(--elevated); border-color: var(--hairline); color: var(--ink);">
    <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-emerald-500/15 text-emerald-500">
        <i data-lucide="check" class="w-4 h-4"></i>
    </div>
    <span id="toastMsg" class="text-xs font-semibold">Profile updated successfully!</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.lucide)lucide.createIcons();});</script>
</body>
</html>
