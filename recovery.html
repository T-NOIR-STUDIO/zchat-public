<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>ZChat — Passcode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base-theme.css">
    <link rel="stylesheet" href="css/bubble-send-colors.css">
    <link rel="stylesheet" href="css/chat-search.css">
    <link rel="stylesheet" href="css/composer-shell-input.css">
    <link rel="stylesheet" href="css/composers-buttons.css">
    <link rel="stylesheet" href="css/disappearing-menu.css">
    <link rel="stylesheet" href="css/header-buttons.css">
    <link rel="stylesheet" href="css/message-action-menu.css">
    <link rel="stylesheet" href="css/reply-image.css">
    <link rel="stylesheet" href="css/theme-vars-extra-controls.css">
    <link rel="stylesheet" href="css/toast-screenshot.css">
    <link rel="stylesheet" href="css/verified-badge.css">
    <link rel="stylesheet" href="css/video-call.css">
    <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="any"/>
    <link rel="icon" href="/assets/img/favicon-16.png" type="image/png" sizes="any"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function () {
            try {
                const t = localStorage.getItem("zchat_theme") || localStorage.getItem("theme") || "system";
                const dark = t === "dark" || (t !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark", !!dark);
                document.documentElement.dataset.theme = dark ? "dark" : "light";
            } catch (_) {}
        })();
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: "var(--canvas)", surface: "var(--surface)", elevated: "var(--elevated)",
                        elevated2: "var(--elevated2)", ink: "var(--ink)", muted: "var(--muted)", faint: "var(--faint)",
                    },
                    fontFamily: { display: ["Manrope", "sans-serif"], body: ["Inter", "sans-serif"] },
                },
            },
        };
    </script>
    <style>
        html, body { background-color: var(--canvas); color: var(--ink); }
        .pass-dot {
            width: 28px; height: 28px; border-radius: 999px;
            border: 2.5px solid rgba(160, 160, 160, 0.85);
            background: transparent; box-sizing: border-box;
            display: inline-flex; align-items: center; justify-content: center;
        }
        html:not(.dark) .pass-dot, html[data-theme="light"] .pass-dot { border-color: rgba(120, 120, 120, 0.75); }
        .pass-dot.filled { background: transparent; border-color: rgba(160, 160, 160, 0.95); }
        .pass-dot.filled::after {
            content: ""; width: 12px; height: 12px; border-radius: 999px; background: #fff; display: block;
        }
        html:not(.dark) .pass-dot.filled::after, html[data-theme="light"] .pass-dot.filled::after { background: #111; }
        .pass-dot.error { border-color: #ef4444 !important; }
        .pass-dot.error.filled::after { background: #ef4444; }
        .pass-shake { animation: pass-shake .4s ease; }
        @keyframes pass-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        #lockTimer { color: #ef4444; font-variant-numeric: tabular-nums; font-weight: 700; }
        #passHiddenInput {
            position: absolute; opacity: 0; width: 1px; height: 1px; border: 0; padding: 0; margin: 0;
            caret-color: transparent;
        }
        #passDotsHit { cursor: text; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="h-full font-body" style="background-color: var(--canvas); color: var(--ink);">

<div id="passcodeScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center px-6" style="background-color: var(--canvas);">
    <div class="w-full max-w-sm flex flex-col items-center gap-2">
        <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-full" style="background-color: var(--elevated); color: var(--ink);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 id="passTitle" class="font-display text-xl font-extrabold tracking-tight text-center">Enter a passcode</h1>
        <p id="passSubtitle" class="text-sm text-center" style="color: var(--muted);">Enter your 4-digit passcode</p>
        <div id="passDotsHit" class="relative mt-10 mb-2 px-6 py-4" role="group" aria-label="Passcode">
            <input id="passHiddenInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" enterkeyhint="done" aria-label="Passcode digits"/>
            <div id="passDots" class="flex items-center justify-center gap-7 pointer-events-none">
                <div class="pass-dot" data-i="0"></div>
                <div class="pass-dot" data-i="1"></div>
                <div class="pass-dot" data-i="2"></div>
                <div class="pass-dot" data-i="3"></div>
            </div>
        </div>
        <p id="passError" class="hidden text-sm font-medium text-center mt-3" style="color: #ef4444;"></p>
        <p id="lockTimer" class="hidden text-2xl text-center mt-3 tracking-wide"></p>
        <p id="attemptsLeft" class="text-xs text-center mt-2" style="color: var(--faint);"></p>
        <p class="text-[11px] text-center mt-8" style="color: var(--faint);">Use your keyboard to enter digits</p>
    </div>
</div>
<div id="betaBlocked" class="hidden"></div>
<script src="js/auth.js"></script>
<script src="js/recovery.js"></script>
</body>
</html>
